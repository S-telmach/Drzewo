<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drzewo Genealogiczne</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap');

:root {
  --bg: #f5f0e8;
  --bg2: #ece5d5;
  --surface: #faf7f2;
  --border: #c8b89a;
  --border2: #e0d4be;
  --text: #2a1f0e;
  --text-muted: #7a6a52;
  --accent: #8b3a1a;
  --accent2: #2a5a3a;
  --female: #7a2a4a;
  --male: #1a3a6a;
  --center: #8b3a1a;
  --shadow: rgba(42,31,14,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* NOISE */
body::after {
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
}

/* TOP BAR */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  flex-shrink: 0;
  box-shadow: 0 2px 8px var(--shadow);
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-style: italic;
  color: var(--accent);
  white-space: nowrap;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 360px;
}

.search-wrap input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}

.search-wrap input:focus { border-color: var(--accent); }
.search-wrap input::placeholder { color: var(--text-muted); }

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
  pointer-events: none;
}

.search-results {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  max-height: 240px;
  overflow-y: auto;
  z-index: 100;
  box-shadow: 0 4px 16px var(--shadow);
  display: none;
}

.search-results.open { display: block; }

.search-item {
  padding: 8px 12px;
  cursor: pointer;
  font-size: 12px;
  border-bottom: 1px solid var(--border2);
  transition: background 0.15s;
}

.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--bg2); }
.search-item .name { font-weight: 500; }
.search-item .dates { color: var(--text-muted); font-size: 11px; }

.view-btns {
  display: flex;
  gap: 4px;
}

.vbtn {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
  white-space: nowrap;
}

.vbtn.active, .vbtn:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.upload-btn {
  padding: 7px 14px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
  white-space: nowrap;
}

.upload-btn:hover { background: var(--accent); color: white; }

/* MAIN */
.main {
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* TREE VIEW */
#treeView {
  width: 100%;
  height: 100%;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.tree-container {
  position: relative;
  min-width: 800px;
}

svg.tree-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

.tree-grid {
  display: grid;
  gap: 0;
  position: relative;
}

/* Person card */
.person-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  cursor: pointer;
  transition: all 0.2s;
  width: 160px;
  margin: 8px;
  box-shadow: 0 2px 6px var(--shadow);
  position: relative;
}

.person-card:hover {
  border-color: var(--accent);
  box-shadow: 0 4px 12px var(--shadow);
  transform: translateY(-1px);
}

.person-card.center-card {
  border-color: var(--center);
  border-width: 2px;
  background: #fdf5ec;
  box-shadow: 0 4px 16px rgba(139,58,26,0.2);
}

.person-card.female { border-left: 3px solid var(--female); }
.person-card.male { border-left: 3px solid var(--male); }
.person-card.unknown { border-left: 3px solid var(--text-muted); }

.card-name {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  line-height: 1.3;
  margin-bottom: 4px;
  color: var(--text);
}

.card-dates {
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
}

.card-badge {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent);
  font-weight: 500;
}

/* LIST VIEW */
#listView {
  width: 100%;
  height: 100%;
  overflow: auto;
  padding: 24px;
  display: none;
}

.list-header {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-style: italic;
  color: var(--accent);
  margin-bottom: 20px;
}

.list-tree { font-size: 13px; line-height: 1.8; }

.list-item {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 3px 0;
  cursor: pointer;
  transition: color 0.15s;
}

.list-item:hover { color: var(--accent); }

.list-num {
  color: var(--text-muted);
  font-size: 11px;
  min-width: 60px;
  text-align: right;
  flex-shrink: 0;
}

.list-name { font-family: 'Playfair Display', serif; }
.list-dates { color: var(--text-muted); font-size: 11px; }

/* PERSON PANEL */
.person-panel {
  position: fixed;
  right: 0;
  top: 0;
  bottom: 0;
  width: 300px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  padding: 24px 20px;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.3s ease;
  z-index: 50;
  box-shadow: -4px 0 20px var(--shadow);
}

.person-panel.open { transform: translateX(0); }

.panel-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--text-muted);
  line-height: 1;
}

.panel-close:hover { color: var(--accent); }

.panel-name {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  line-height: 1.2;
  margin-bottom: 4px;
  padding-right: 30px;
  color: var(--text);
}

.panel-sex {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.panel-section {
  margin-bottom: 16px;
}

.panel-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--text-muted);
  margin-bottom: 6px;
  border-bottom: 1px solid var(--border2);
  padding-bottom: 4px;
}

.panel-field {
  font-size: 12px;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.5;
}

.panel-field .label { color: var(--text-muted); }

.panel-person-link {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
  padding: 2px 0;
  display: block;
  font-family: 'Playfair Display', serif;
  transition: opacity 0.15s;
}

.panel-person-link:hover { opacity: 0.7; }

.panel-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
}

.panel-btn {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: left;
}

.panel-btn:hover { border-color: var(--accent); color: var(--accent); }
.panel-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.panel-btn.primary:hover { background: #6a2a10; }

/* EMPTY STATE */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  color: var(--text-muted);
}

.empty-state h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-style: italic;
  color: var(--accent);
}

.empty-state p { font-size: 13px; text-align: center; line-height: 1.7; max-width: 360px; }

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 32px 48px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}

.drop-zone:hover, .drop-zone.dragging {
  border-color: var(--accent);
  background: rgba(139,58,26,0.04);
}

.drop-zone p { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 6px;
  font-size: 12px;
  transition: transform 0.3s;
  z-index: 200;
  letter-spacing: 0.5px;
}

.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  .person-panel { width: 100%; }
  .logo { font-size: 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Drzewo Genealogiczne</div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Szukaj osoby..." oninput="handleSearch()" onfocus="openSearch()" onblur="closeSearchDelay()">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="view-btns">
    <button class="vbtn active" id="btnTree" onclick="switchView('tree')">Drzewo</button>
    <button class="vbtn" id="btnList" onclick="switchView('list')">Lista</button>
  </div>

  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">⬆ Wgraj GEDCOM</button>
  <input type="file" id="fileInput" accept=".ged,.gedcom" style="display:none" onchange="loadFile(event)">
</div>

<div class="main">
  <div id="treeView">
    <div class="empty-state" id="emptyState">
      <h2>Drzewo Genealogiczne</h2>
      <p>Wgraj plik GEDCOM aby rozpocząć. Możesz przeciągnąć plik na tę stronę.</p>
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <div style="font-size:32px">🌳</div>
        <p>Kliknij lub przeciągnij plik .ged</p>
      </div>
    </div>
    <div id="treeCanvas" style="display:none; position:relative;"></div>
  </div>

  <div id="listView">
    <div class="list-header" id="listHeader">Lista potomków</div>
    <div class="list-tree" id="listContent"></div>
  </div>
</div>

<div class="person-panel" id="personPanel">
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div id="panelContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // PIN LOCK
(function() {
  const CORRECT = '6789';
  const stored = sessionStorage.getItem('pin_ok');
  if (stored === '1') return;
  document.body.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#f5f0e8;font-family:'IBM Plex Mono',monospace;gap:16px;">
      <div style="font-family:'Playfair Display',serif;font-size:28px;font-style:italic;color:#8b3a1a;">Drzewo Genealogiczne</div>
      <div style="font-size:12px;color:#7a6a52;letter-spacing:2px;text-transform:uppercase;">Wprowadź PIN</div>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="4" autofocus
        style="font-size:28px;letter-spacing:12px;width:140px;text-align:center;padding:12px;border:1px solid #c8b89a;border-radius:8px;background:#faf7f2;color:#2a1f0e;outline:none;">
      <div id="pinErr" style="color:#8b3a1a;font-size:12px;min-height:16px;"></div>
    </div>`;
  document.getElementById('pinInput').addEventListener('input', function() {
    if (this.value.length === 4) {
      if (this.value === CORRECT) {
        sessionStorage.setItem('pin_ok', '1');
        location.reload();
      } else {
        document.getElementById('pinErr').textContent = 'Błędny PIN';
        this.value = '';
      }
    }
  });
})();
// ============================================================
// GEDCOM PARSER
// ============================================================
let db = { individuals: {}, families: {} };
let centerPersonId = null;
let currentView = 'tree';
let listMode = 'descendants'; // or 'ancestors'

function parseGEDCOM(text) {
  const lines = text.split(/\r?\n/);
  const indis = {};
  const fams = {};

  let curType = null, curId = null, curObj = null, curSub = null;

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    const m = line.match(/^(\d+)\s+(@[^@]+@|[A-Z_]+)\s*(.*)?$/);
    if (!m) continue;
    const level = parseInt(m[1]);
    const tag = m[2];
    const val = (m[3] || '').trim();

    if (level === 0) {
      curSub = null;
      if (tag.startsWith('@') && val === 'INDI') {
        curType = 'INDI'; curId = tag;
        curObj = { id: tag, name: '', surname: '', given: '', sex: 'U', birt: {}, deat: {}, famc: [], fams: [] };
        indis[curId] = curObj;
      } else if (tag.startsWith('@') && val === 'FAM') {
        curType = 'FAM'; curId = tag;
        curObj = { id: tag, husb: null, wife: null, chil: [] };
        fams[curId] = curObj;
      } else { curType = null; curObj = null; }
      continue;
    }

    if (!curObj) continue;

    if (curType === 'INDI') {
      if (level === 1) {
        curSub = tag;
        if (tag === 'NAME') {
          const parts = val.match(/^(.*?)\/([^/]*)\/(.*)$/);
          if (parts) {
            curObj.given = parts[1].trim();
            curObj.surname = parts[2].trim();
            curObj.name = (curObj.given + ' ' + curObj.surname).trim();
          } else { curObj.name = val.replace(/\//g,'').trim(); curObj.given = val.replace(/\//g,'').trim(); }
        }
        if (tag === 'SEX') curObj.sex = val;
        if (tag === 'FAMC') curObj.famc.push(val);
        if (tag === 'FAMS') curObj.fams.push(val);
      }
      if (level === 2) {
        if (curSub === 'BIRT') { if (tag === 'DATE') curObj.birt.date = val; if (tag === 'PLAC') curObj.birt.place = val; }
        if (curSub === 'DEAT') { if (tag === 'DATE') curObj.deat.date = val; if (tag === 'PLAC') curObj.deat.place = val; }
      }
    }

    if (curType === 'FAM') {
      if (level === 1) {
        if (tag === 'HUSB') curObj.husb = val;
        if (tag === 'WIFE') curObj.wife = val;
        if (tag === 'CHIL') curObj.chil.push(val);
      }
    }
  }

  // fix names
  for (const id in indis) {
    const p = indis[id];
    if (!p.name) p.name = '?';
  }

  db = { individuals: indis, families: fams };
  return db;
}

function getPerson(id) { return db.individuals[id]; }

function getParents(personId) {
  const p = getPerson(personId);
  if (!p) return { father: null, mother: null };
  let father = null, mother = null;
  for (const famId of p.famc) {
    const fam = db.families[famId];
    if (!fam) continue;
    if (fam.husb) father = getPerson(fam.husb);
    if (fam.wife) mother = getPerson(fam.wife);
  }
  return { father, mother };
}

function getSpouses(personId) {
  const p = getPerson(personId);
  if (!p) return [];
  const spouses = [];
  for (const famId of p.fams) {
    const fam = db.families[famId];
    if (!fam) continue;
    const spouseId = fam.husb === personId ? fam.wife : fam.husb;
    if (spouseId) spouses.push({ person: getPerson(spouseId), famId });
  }
  return spouses;
}

function getChildren(personId) {
  const p = getPerson(personId);
  if (!p) return [];
  const children = [];
  for (const famId of p.fams) {
    const fam = db.families[famId];
    if (!fam) continue;
    for (const cId of fam.chil) {
      const child = getPerson(cId);
      if (child) children.push(child);
    }
  }
  return children;
}

function getSiblings(personId) {
  const p = getPerson(personId);
  if (!p) return [];
  const siblings = [];
  for (const famId of p.famc) {
    const fam = db.families[famId];
    if (!fam) continue;
    for (const cId of fam.chil) {
      if (cId !== personId) { const s = getPerson(cId); if (s) siblings.push(s); }
    }
  }
  return siblings;
}

function formatDate(d) {
  if (!d || !d.date) return '';
  return d.date;
}

function formatLifeDates(p) {
  const b = formatDate(p.birt);
  const d = formatDate(p.deat);
  if (b && d) return `${b} – ${d}`;
  if (b) return `ur. ${b}`;
  if (d) return `zm. ${d}`;
  return '';
}

function sexClass(sex) {
  if (sex === 'M') return 'male';
  if (sex === 'F') return 'female';
  return 'unknown';
}

// ============================================================
// FILE LOAD
// ============================================================
function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    parseGEDCOM(e.target.result);
    const ids = Object.keys(db.individuals);
    showToast(`Wczytano ${ids.length} osób`);
    // pick first person or try to find a good root
    centerPersonId = ids[0];
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('treeCanvas').style.display = 'block';
    renderTree();
  };
  reader.readAsText(file, 'UTF-8');
}

// ============================================================
// TREE RENDER
// ============================================================
function renderTree() {
  if (!centerPersonId) return;
  const canvas = document.getElementById('treeCanvas');
  canvas.innerHTML = '';

  const center = getPerson(centerPersonId);
  if (!center) return;

  const { father, mother } = getParents(centerPersonId);
  const children = getChildren(centerPersonId);
  const spouses = getSpouses(centerPersonId);
  const siblings = getSiblings(centerPersonId);

  // paternal grandparents
  let pGrandFather = null, pGrandMother = null;
  if (father) { const pp = getParents(father.id); pGrandFather = pp.father; pGrandMother = pp.mother; }
  let mGrandFather = null, mGrandMother = null;
  if (mother) { const mp = getParents(mother.id); mGrandFather = mp.father; mGrandMother = mp.mother; }

  const CARD_W = 160, CARD_H = 80, GAP_X = 24, GAP_Y = 60;
  const ROW_H = CARD_H + GAP_Y;

  // Layout: 5 rows (grandparents, parents, center+siblings, spouses+children row, grandchildren?)
  // Simplified: 4 visible rows
  // Row 0: grandparents (up to 4)
  // Row 1: parents (up to 2) + their siblings stripped
  // Row 2: center + siblings
  // Row 3: spouses
  // Row 4: children

  const totalRows = 5;
  const totalCols = Math.max(6, siblings.length + 1, children.length + spouses.length);
  const W = totalCols * (CARD_W + GAP_X) + GAP_X;
  const H = totalRows * ROW_H + GAP_Y;

  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  canvas.style.position = 'relative';

  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.classList.add('tree-svg');
  canvas.appendChild(svg);

  const positions = {};

  function placeCard(person, col, row, isCenter) {
    if (!person) return null;
    const x = col * (CARD_W + GAP_X) + GAP_X;
    const y = row * ROW_H + GAP_Y;
    positions[person.id] = { x, y, cx: x + CARD_W/2, cy: y + CARD_H/2 };
    const card = createCard(person, isCenter);
    card.style.position = 'absolute';
    card.style.left = x + 'px';
    card.style.top = y + 'px';
    canvas.appendChild(card);
    return { x, y };
  }

  // center column
  const centerCol = Math.max(2, Math.floor(totalCols / 2) - Math.floor((siblings.length)/2));
  const centerRow = 2;

  // place grandparents row 0
  if (pGrandFather) placeCard(pGrandFather, centerCol - 3, 0);
  if (pGrandMother) placeCard(pGrandMother, centerCol - 2, 0);
  if (mGrandFather) placeCard(mGrandFather, centerCol + 1, 0);
  if (mGrandMother) placeCard(mGrandMother, centerCol + 2, 0);

  // parents row 1
  if (father) placeCard(father, centerCol - 1, 1);
  if (mother) placeCard(mother, centerCol + 1, 1);

  // siblings + center row 2
  const sibOffset = centerCol - Math.floor(siblings.length / 2);
  siblings.forEach((s, i) => {
    const col = i < Math.floor(siblings.length/2) ? sibOffset + i : sibOffset + i + 1;
    placeCard(s, col < centerCol ? col : col, centerRow);
  });
  placeCard(center, centerCol, centerRow, true);

  // spouses row 3
  spouses.forEach((sp, i) => {
    placeCard(sp.person, centerCol + 1 + i, 3);
  });

  // children row 4
  const childOffset = Math.max(0, centerCol - Math.floor(children.length / 2));
  children.forEach((c, i) => placeCard(c, childOffset + i, 4));

  // draw lines
  function line(x1, y1, x2, y2) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    path.setAttribute('d', `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#c8b89a');
    path.setAttribute('stroke-width', '1.5');
    svg.appendChild(path);
  }

  function connectParentChild(parentId, childId) {
    const p = positions[parentId], c = positions[childId];
    if (!p || !c) return;
    line(p.cx, p.y + CARD_H, c.cx, c.y);
  }

  // grandparent -> parent
  if (father) {
    if (pGrandFather) connectParentChild(pGrandFather.id, father.id);
    if (pGrandMother) connectParentChild(pGrandMother.id, father.id);
  }
  if (mother) {
    if (mGrandFather) connectParentChild(mGrandFather.id, mother.id);
    if (mGrandMother) connectParentChild(mGrandMother.id, mother.id);
  }

  // parent -> center
  if (father) connectParentChild(father.id, center.id);
  if (mother) connectParentChild(mother.id, center.id);

  // parent -> siblings
  siblings.forEach(s => {
    if (father) connectParentChild(father.id, s.id);
    if (mother) connectParentChild(mother.id, s.id);
  });

  // center -> children
  children.forEach(c => connectParentChild(center.id, c.id));

  // spouse line (horizontal dashed)
  spouses.forEach(sp => {
    const cp = positions[center.id], sp2 = positions[sp.person.id];
    if (!cp || !sp2) return;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    path.setAttribute('x1', cp.x + CARD_W);
    path.setAttribute('y1', cp.cy);
    path.setAttribute('x2', sp2.x);
    path.setAttribute('y2', sp2.cy);
    path.setAttribute('stroke', '#c8b89a');
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('stroke-dasharray', '5,3');
    svg.appendChild(path);
  });

  // scroll to center
  setTimeout(() => {
    const pos = positions[centerPersonId];
    if (pos) {
      const wrap = document.getElementById('treeView');
      wrap.scrollLeft = pos.x - wrap.clientWidth/2 + CARD_W/2;
      wrap.scrollTop = pos.y - wrap.clientHeight/2 + CARD_H/2;
    }
  }, 50);
}

function createCard(person, isCenter) {
  const div = document.createElement('div');
  div.className = `person-card ${sexClass(person.sex)}${isCenter ? ' center-card' : ''}`;
  div.style.width = '160px';

  const dates = formatLifeDates(person);
  div.innerHTML = `
    ${isCenter ? '<span class="card-badge">centrum</span>' : ''}
    <div class="card-name">${person.name}</div>
    ${dates ? `<div class="card-dates">${dates}</div>` : ''}
  `;
  div.onclick = () => openPanel(person.id);
  return div;
}

// ============================================================
// LIST VIEW (d'Aboville)
// ============================================================
function switchView(view) {
  currentView = view;
  document.getElementById('btnTree').classList.toggle('active', view === 'tree');
  document.getElementById('btnList').classList.toggle('active', view === 'list');
  document.getElementById('treeView').style.display = view === 'tree' ? 'flex' : 'none';
  document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
  if (view === 'list' && centerPersonId) renderList();
}

function renderList(mode) {
  if (mode) listMode = mode;
  const container = document.getElementById('listContent');
  const header = document.getElementById('listHeader');
  if (!centerPersonId) { container.innerHTML = '<p>Brak danych.</p>'; return; }

  const center = getPerson(centerPersonId);
  if (!center) return;

  if (listMode === 'descendants') {
    header.textContent = `Potomkowie: ${center.name}`;
    const items = [];
    collectDescendants(centerPersonId, '', items);
    container.innerHTML = items.map(item => `
      <div class="list-item" onclick="focusPerson('${item.id}')">
        <span class="list-num">${item.num}</span>
        <span class="list-name">${item.name}</span>
        <span class="list-dates">${item.dates}</span>
      </div>
    `).join('');
  } else {
    header.textContent = `Przodkowie: ${center.name}`;
    const items = [];
    collectAncestors(centerPersonId, 1, items);
    container.innerHTML = items.map(item => `
      <div class="list-item" onclick="focusPerson('${item.id}')">
        <span class="list-num">${item.num}</span>
        <span class="list-name">${item.name}</span>
        <span class="list-dates">${item.dates}</span>
      </div>
    `).join('');
  }
}

function collectDescendants(personId, prefix, items, depth=0) {
  const children = getChildren(personId);
  children.forEach((child, i) => {
    const num = prefix ? `${prefix}.${i+1}` : `${i+1}`;
    items.push({ id: child.id, num, name: child.name, dates: formatLifeDates(child) });
    collectDescendants(child.id, num, items, depth+1);
  });
}

function collectAncestors(personId, num, items) {
  const { father, mother } = getParents(personId);
  if (father) {
    items.push({ id: father.id, num: `${num}`, name: father.name, dates: formatLifeDates(father) });
    collectAncestors(father.id, num * 2, items);
  }
  if (mother) {
    items.push({ id: mother.id, num: `${num+1}`, name: mother.name, dates: formatLifeDates(mother) });
    collectAncestors(mother.id, (num+1) * 2, items);
  }
}

// ============================================================
// PERSON PANEL
// ============================================================
function openPanel(personId) {
  const p = getPerson(personId);
  if (!p) return;
  const { father, mother } = getParents(personId);
  const children = getChildren(personId);
  const spouses = getSpouses(personId);
  const siblings = getSiblings(personId);

  const sexLabel = p.sex === 'M' ? 'Mężczyzna' : p.sex === 'F' ? 'Kobieta' : 'Nieznana';

  let html = `
    <div class="panel-name">${p.name}</div>
    <div class="panel-sex">${sexLabel}</div>
  `;

  // birth
  if (p.birt.date || p.birt.place) {
    html += `<div class="panel-section">
      <div class="panel-section-title">Urodzenie</div>
      ${p.birt.date ? `<div class="panel-field"><span class="label">Data: </span>${p.birt.date}</div>` : ''}
      ${p.birt.place ? `<div class="panel-field"><span class="label">Miejsce: </span>${p.birt.place}</div>` : ''}
    </div>`;
  }

  // death
  if (p.deat.date || p.deat.place) {
    html += `<div class="panel-section">
      <div class="panel-section-title">Śmierć</div>
      ${p.deat.date ? `<div class="panel-field"><span class="label">Data: </span>${p.deat.date}</div>` : ''}
      ${p.deat.place ? `<div class="panel-field"><span class="label">Miejsce: </span>${p.deat.place}</div>` : ''}
    </div>`;
  }

  // parents
  if (father || mother) {
    html += `<div class="panel-section"><div class="panel-section-title">Rodzice</div>`;
    if (father) html += `<span class="panel-person-link" onclick="focusPerson('${father.id}')">♂ ${father.name}</span>`;
    if (mother) html += `<span class="panel-person-link" onclick="focusPerson('${mother.id}')">♀ ${mother.name}</span>`;
    html += `</div>`;
  }

  // spouses
  if (spouses.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Małżonek/małżonkowie</div>`;
    spouses.forEach(sp => {
      html += `<span class="panel-person-link" onclick="focusPerson('${sp.person.id}')">⚭ ${sp.person.name}</span>`;
    });
    html += `</div>`;
  }

  // children
  if (children.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Dzieci (${children.length})</div>`;
    children.forEach(c => {
      html += `<span class="panel-person-link" onclick="focusPerson('${c.id}')">${c.sex==='M'?'♂':'♀'} ${c.name}</span>`;
    });
    html += `</div>`;
  }

  // siblings
  if (siblings.length) {
    html += `<div class="panel-section"><div class="panel-section-title">Rodzeństwo (${siblings.length})</div>`;
    siblings.slice(0,5).forEach(s => {
      html += `<span class="panel-person-link" onclick="focusPerson('${s.id}')">${s.sex==='M'?'♂':'♀'} ${s.name}</span>`;
    });
    if (siblings.length > 5) html += `<div class="panel-field" style="color:var(--text-muted)">...i ${siblings.length-5} więcej</div>`;
    html += `</div>`;
  }

  // actions
  html += `<div class="panel-actions">
    <button class="panel-btn primary" onclick="focusPerson('${p.id}'); closePanel()">Centruj w drzewie</button>
    <button class="panel-btn" onclick="exportDescendantsTXT('${p.id}')">⬇ TXT — potomkowie</button>
    <button class="panel-btn" onclick="exportAncestorsTXT('${p.id}')">⬇ TXT — przodkowie</button>
  </div>`;

  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('personPanel').classList.add('open');
}

function closePanel() {
  document.getElementById('personPanel').classList.remove('open');
}

function focusPerson(id) {
  centerPersonId = id;
  closePanel();
  if (currentView === 'tree') renderTree();
  else renderList();
}

// ============================================================
// EXPORT TXT
// ============================================================
function exportDescendantsTXT(personId) {
  const p = getPerson(personId);
  if (!p) return;
  let txt = `LISTA POTOMKÓW\n${p.name}\n${'='.repeat(40)}\n\n`;
  const items = [];
  collectDescendants(personId, '', items);
  if (!items.length) { txt += '(brak potomków)'; }
  items.forEach(item => {
    txt += `${item.num.padEnd(12)} ${item.name}`;
    if (item.dates) txt += `  [${item.dates}]`;
    txt += '\n';
  });
  downloadTXT(txt, `potomkowie_${p.name.replace(/\s+/g,'_')}.txt`);
}

function exportAncestorsTXT(personId) {
  const p = getPerson(personId);
  if (!p) return;
  let txt = `LISTA PRZODKÓW\n${p.name}\n${'='.repeat(40)}\n\n`;
  const items = [];
  collectAncestors(personId, 1, items);
  if (!items.length) { txt += '(brak przodków)'; }
  items.forEach(item => {
    txt += `${String(item.num).padEnd(8)} ${item.name}`;
    if (item.dates) txt += `  [${item.dates}]`;
    txt += '\n';
  });
  downloadTXT(txt, `przodkowie_${p.name.replace(/\s+/g,'_')}.txt`);
}

function downloadTXT(content, filename) {
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast('Plik pobrany');
}

// ============================================================
// SEARCH
// ============================================================
let searchTimeout = null;

function handleSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(doSearch, 150);
}

function doSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('searchResults');
  if (!q || Object.keys(db.individuals).length === 0) { container.classList.remove('open'); return; }

  const results = Object.values(db.individuals)
    .filter(p => p.name.toLowerCase().includes(q))
    .slice(0, 12);

  if (!results.length) { container.innerHTML = '<div class="search-item"><span class="dates">Brak wyników</span></div>'; container.classList.add('open'); return; }

  container.innerHTML = results.map(p => `
    <div class="search-item" onmousedown="selectPerson('${p.id}')">
      <div class="name">${p.name}</div>
      <div class="dates">${formatLifeDates(p)}</div>
    </div>
  `).join('');
  container.classList.add('open');
}

function selectPerson(id) {
  focusPerson(id);
  openPanel(id);
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').classList.remove('open');
}

function openSearch() {
  if (document.getElementById('searchInput').value.trim()) doSearch();
}

function closeSearchDelay() {
  setTimeout(() => document.getElementById('searchResults').classList.remove('open'), 200);
}

// ============================================================
// DRAG & DROP
// ============================================================
const dropZone = document.getElementById('dropZone');
if (dropZone) {
  document.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
  document.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
  document.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    const file = e.dataTransfer.files[0];
    if (file) { const fakeEvt = { target: { files: [file] } }; loadFile(fakeEvt); }
  });
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
